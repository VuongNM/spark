# Builds the Windows installer on a Windows machine (native modules need their Windows builds)
# and attaches it to the GitHub release that scripts/publish.sh just published.
name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to (leave blank to only build)
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - run: npx electron-builder --win --publish never
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        run: gh release upload "$TAG" dist/Spark-win-x64.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: Spark-win-x64
          path: dist/Spark-win-x64.exe
